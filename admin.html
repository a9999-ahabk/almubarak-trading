<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة تحكم الموقع</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    body{ background: #f7f2ea; font-family: "Cairo", sans-serif; }
    .admin-shell{
      max-width: 1100px;
      margin: 60px auto;
      padding: 32px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 25px 55px -30px rgba(0,0,0,0.25);
    }
    .admin-head{
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .admin-head h1{
      margin: 0;
      color: #12312E;
      font-size: 2rem;
    }
    .admin-actions{ display: flex; gap: 12px; flex-wrap: wrap; }
    .admin-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
    .panel{
      background: #fffaf3;
      border: 1px solid rgba(18,49,46,0.08);
      border-radius: 18px;
      padding: 22px;
    }
    .panel h3{ margin-top: 0; color: #12312E; font-size: 1.2rem; }
    .field{ display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .field label{ color: #12312E; font-weight: 600; font-size: 0.92rem; }
    .field input,
    .field textarea{
      width: 100%;
      border: 1px solid rgba(18,49,46,0.12);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      font-family: "Cairo", sans-serif;
      color: #201C15;
    }
    .field textarea{ min-height: 120px; resize: vertical; }
    .btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-family: "Cairo", sans-serif;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-save{ background: #25D366; color: white; }
    .btn-reset{ background: #B8874A; color: white; }
    .btn-preview{ background: #12312E; color: white; }
    .status{
      margin-top: 18px;
      min-height: 24px;
      font-size: 0.92rem;
      font-weight: 600;
      color: #9C4A36;
    }
    @media (max-width: 820px){ .admin-grid{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="admin-shell">
    <div class="admin-head">
      <h1>لوحة التحكم</h1>
      <div class="admin-actions">
        <a class="btn btn-preview" href="index.html" target="_blank">معاينة الموقع</a>
      </div>
    </div>

    <form id="configForm">
      <div class="admin-grid">
        <div class="panel">
          <h3>البيانات الأساسية</h3>

          <div class="field">
            <label for="companyName">اسم الشركة المختصر</label>
            <input id="companyName" name="companyName" type="text" />
          </div>

          <div class="field">
            <label for="brandSubtitle">شرح اسم الشركة</label>
            <input id="brandSubtitle" name="brandSubtitle" type="text" />
          </div>

          <div class="field">
            <label for="fullName">اسم الشركة الكامل</label>
            <input id="fullName" name="fullName" type="text" />
          </div>

          <div class="field">
            <label for="phoneNumber">رقم الهاتف</label>
            <input id="phoneNumber" name="phoneNumber" type="text" />
          </div>

          <div class="field">
            <label for="whatsappNumber">رقم الواتساب</label>
            <input id="whatsappNumber" name="whatsappNumber" type="text" />
          </div>

          <div class="field">
            <label for="whatsappMessage">رسالة واتساب الافتراضية</label>
            <input id="whatsappMessage" name="whatsappMessage" type="text" />
          </div>
        </div>

        <div class="panel">
          <h3>محتوى الصفحة</h3>

          <div class="field">
            <label for="heroTitle">عنوان الواجهة الرئيسية</label>
            <input id="heroTitle" name="heroTitle" type="text" />
          </div>

          <div class="field">
            <label for="heroSubtitleSpan">سطر العنوان الثاني</label>
            <input id="heroSubtitleSpan" name="heroSubtitleSpan" type="text" />
          </div>

          <div class="field">
            <label for="heroDescription">وصف الواجهة</label>
            <textarea id="heroDescription" name="heroDescription"></textarea>
          </div>

          <div class="field">
            <label for="aboutText">نص من نحن</label>
            <textarea id="aboutText" name="aboutText"></textarea>
          </div>

          <div class="field">
            <label for="footerBrandText">نص الفوتر</label>
            <textarea id="footerBrandText" name="footerBrandText"></textarea>
          </div>
        </div>

        <div class="panel" style="grid-column: 1 / -1;">
          <h3>روابط الموقع</h3>

          <div class="field">
            <label for="ogUrl">رابط الموقع</label>
            <input id="ogUrl" name="ogUrl" type="text" />
          </div>

          <div class="field">
            <label for="canonicalUrl">رابط Canonical</label>
            <input id="canonicalUrl" name="canonicalUrl" type="text" />
          </div>

          <div class="field">
            <label for="ogImage">اسم صورة OG</label>
            <input id="ogImage" name="ogImage" type="text" />
          </div>
        </div>
      </div>

      <div class="admin-actions" style="margin-top: 24px;">
        <button type="submit" class="btn btn-save">حفظ البيانات</button>
        <button type="button" class="btn btn-reset" id="resetConfig">إعادة التهيئة</button>
      </div>

      <div class="status" id="status"></div>
    </form>
  </div>

  <script src="admin.js"></script>
</body>
</html>
